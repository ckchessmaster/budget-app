<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				var c = localStorage.getItem('color-scheme');
				if (c === 'light' || c === 'dark') {
					document.querySelector('meta[name="color-scheme"]').content = c;
				}
			} catch {}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f172a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script src="/config.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-dvh w-full overflow-hidden bg-canvas text-ink-primary">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
