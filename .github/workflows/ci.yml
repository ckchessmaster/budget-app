name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budgetdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and build binaries
        run: |
          GOWORK=off go vet ./...
          GOWORK=off go build ./cmd/api ./cmd/worker ./cmd/migrate

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/budgetdb?sslmode=disable
        run: GOWORK=off go run ./cmd/migrate up

      - name: Provision RLS test role
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/budgetdb?sslmode=disable
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'budget_app_user') THEN
              CREATE ROLE budget_app_user WITH LOGIN PASSWORD 'budgetpass';
            END IF;
          END
          $$;
          GRANT USAGE ON SCHEMA public TO budget_app_user;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO budget_app_user;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO budget_app_user;
          SQL

      - name: Run Go tests (unit + Postgres RLS)
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/budgetdb?sslmode=disable
          TEST_DATABASE_URL: postgres://budget_app_user:budgetpass@127.0.0.1:5432/budgetdb?sslmode=disable
        run: GOWORK=off go test -race -count=1 ./...

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run svelte-check
        run: npm run check

      - name: Build production bundle
        run: npm run build

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint charts/budget-app
