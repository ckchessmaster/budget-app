apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-backend
  labels:
    app: budget-backend
    app.kubernetes.io/part-of: budget-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-backend
  template:
    metadata:
      labels:
        app: budget-backend
        app.kubernetes.io/part-of: budget-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/ckchessmaster/budget-backend:latest
          command: ["/usr/local/bin/migrate"]
          envFrom:
            - secretRef:
                name: budget-backend-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: ghcr.io/ckchessmaster/budget-backend:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: budget-app-config
            - secretRef:
                name: budget-backend-secrets
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
