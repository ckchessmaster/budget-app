apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-frontend
  labels:
    app: budget-frontend
    app.kubernetes.io/part-of: budget-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-frontend
  template:
    metadata:
      labels:
        app: budget-frontend
        app.kubernetes.io/part-of: budget-app
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/ckchessmaster/budget-frontend:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: budget-app-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
