apiVersion: v1
kind: Service
metadata:
  name: budget-backend
  labels:
    app: budget-backend
    app.kubernetes.io/part-of: budget-app
spec:
  type: ClusterIP
  selector:
    app: budget-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: budget-frontend
  labels:
    app: budget-frontend
    app.kubernetes.io/part-of: budget-app
spec:
  type: ClusterIP
  selector:
    app: budget-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
