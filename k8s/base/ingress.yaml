apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: budget-app
  labels:
    app.kubernetes.io/part-of: budget-app
spec:
  rules:
    - host: budget.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: budget-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: budget-frontend
                port:
                  name: http
