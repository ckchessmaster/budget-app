# Create this Secret in your cluster/namespace before deploying (do not commit real credentials):
#   kubectl create secret generic budget-backend-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@postgres.namespace.svc.cluster.local:5432/budgetdb?sslmode=require'
apiVersion: v1
kind: Secret
metadata:
  name: budget-backend-secrets
  labels:
    app.kubernetes.io/part-of: budget-app
type: Opaque
stringData:
  DATABASE_URL: "postgres://budget:CHANGE_ME@postgres:5432/budgetdb?sslmode=require"
