apiVersion: v1
kind: ConfigMap
metadata:
  name: budget-app-config
  labels:
    app.kubernetes.io/part-of: budget-app
data:
  # Update to your Authentik application issuer URL (e.g. https://auth.example.com/application/o/budget-app/)
  OIDC_ISSUER_URL: "https://auth.example.com/application/o/budget-app/"
  OIDC_AUTHORITY: "https://auth.example.com/application/o/budget-app/"
  OIDC_CLIENT_ID: "budget-app-client"
  # Empty string routes /api/* through the same-origin Ingress
  API_BASE_URL: ""
  PORT: "8080"
  DB_MAX_CONNS: "25"
