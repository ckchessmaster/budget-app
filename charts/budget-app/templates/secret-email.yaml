{{- if and .Values.email.enabled (not (trim (.Values.email.existingSecret | default ""))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "budget-app.emailSecretName" . }}
  labels:
    {{- include "budget-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.email.apiKeySecretKey | default "RESEND_API_KEY" }}: {{ trim .Values.email.apiKey | quote }}
{{- end }}
