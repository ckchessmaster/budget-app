{{- if and .Values.vapid.enabled (not (trim (.Values.vapid.existingSecret | default ""))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "budget-app.vapidSecretName" . }}
  labels:
    {{- include "budget-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.vapid.privateKeySecretKey }}: {{ trim .Values.vapid.privateKey | quote }}
{{- end }}
