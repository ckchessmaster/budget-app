apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "budget-app.fullname" . }}-backend
  labels:
    app: budget-backend
    {{- include "budget-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: budget-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      # Roll pods when OIDC or CORS configuration changes: envFrom alone does not
      # restart containers, so a security-relevant config edit could sit unapplied.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: budget-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "budget-app.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.backend.runMigrations }}
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["/usr/local/bin/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "budget-app.secretName" . }}
                  key: {{ .Values.database.secretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "budget-app.fullname" . }}-config
          env:
            {{- include "budget-app.syncEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        {{- if .Values.temporal.worker.enabled }}
        # The Temporal sync worker.
        #
        # It is a sidecar in this pod rather than its own Deployment on purpose: the demo
        # SimpleFIN bridge binds loopback (see backend/internal/demo/routes.go), and
        # containers in one pod share a network namespace, so this is the only placement
        # that keeps demo bank sync working without re-exposing the bridge to the cluster.
        # The worker and the API must also read the same VAULT_MASTER_KEY.
        - name: sync-worker
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["/usr/local/bin/worker"]
          envFrom:
            - configMapRef:
                name: {{ include "budget-app.fullname" . }}-config
          env:
            {{- include "budget-app.syncEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.temporal.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        {{- end }}
