{{- if and (not .Values.database.existingSecret) (or .Values.database.url .Values.vault.masterKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "budget-app.secretName" . }}
  labels:
    {{- include "budget-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
  {{- if .Values.vault.masterKey }}
  # Base64 of 32 random bytes. Seals stored SimpleFIN credentials; the API and the sync
  # worker must read the same value. Rotate by clearing simplefin_connections and
  # re-claiming, since old ciphertexts cannot be recovered with a new key.
  {{ .Values.vault.secretKey }}: {{ .Values.vault.masterKey | quote }}
  {{- end }}
{{- end }}
