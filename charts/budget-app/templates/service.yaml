apiVersion: v1
kind: Service
metadata:
  name: {{ include "budget-app.fullname" . }}-backend
  labels:
    app: budget-backend
    {{- include "budget-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: budget-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "budget-app.fullname" . }}-frontend
  labels:
    app: budget-frontend
    {{- include "budget-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: budget-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
