{{- if and .Values.oidc.provisioning.enabled (not (trim (.Values.oidc.provisioning.existingSecret | default ""))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "budget-app.idpSecretName" . }}
  labels:
    {{- include "budget-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.oidc.provisioning.apiTokenSecretKey | default "AUTHENTIK_API_TOKEN" }}: {{ trim .Values.oidc.provisioning.apiToken | quote }}
{{- end }}
