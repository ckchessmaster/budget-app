apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "budget-app.fullname" . }}-config
  labels:
    {{- include "budget-app.labels" . | nindent 4 }}
data:
{{- if not (trim (.Values.temporal.address | default "")) }}
{{- fail "temporal.address is required. Bank sync runs as a Temporal workflow and the API now exits at boot when no server can be reached, so set temporal.address to the Temporal frontend gRPC endpoint (host:port) rather than deploying an app whose sync is silently dead." }}
{{- end }}
{{- if not (trim (.Values.temporal.namespace | default "")) }}
{{- fail "temporal.namespace is required and must name a namespace budget-app owns. The API registers it on boot when missing." }}
{{- end }}
{{- if eq (trim .Values.temporal.namespace) "default" }}
{{- fail "temporal.namespace=default is refused. Workflows, schedules and retained history for banking data must not share a namespace with every other unnamed workload; give budget-app its own." }}
{{- end }}
{{- if and (not (trim (.Values.vault.masterKey | default ""))) (not .Values.vault.existingSecret) (not .Values.database.existingSecret) }}
{{- fail "a vault master key is required: set vault.masterKey, or point vault.existingSecret (or database.existingSecret) at a Secret holding vault.secretKey. There is no fallback key, so stored SimpleFIN credentials cannot be sealed without one." }}
{{- end }}
{{- $bridgeBase := include "budget-app.bridgeBaseUrl" . }}
{{- if and .Values.temporal.worker.enabled (or (contains "127.0.0.1" $bridgeBase) (contains "localhost" $bridgeBase)) }}
{{- fail "backend.mockSimplefinBaseUrl points at loopback while temporal.worker runs the sync worker in its own pod. The worker would dial its own filesystem and demo bank sync would fail with a 404 that looks like a broken bridge; set backend.mockSimplefinBaseUrl to the in-cluster bridge Service address, or clear it to derive one." }}
{{- end }}
{{- if and .Values.oidc.enforceAudience (empty (trim .Values.oidc.clientId | default "")) }}
{{- fail "oidc.clientId is required while oidc.enforceAudience is true: it is the audience the API demands in each token's aud claim. Set oidc.clientId to this application's OIDC client ID, or set oidc.enforceAudience=false to skip only the audience check." }}
{{- end }}
{{- if .Values.vapid.enabled }}
{{- $vapidExistingSecret := trim (.Values.vapid.existingSecret | default "") }}
{{- $vapidPrivateKey := trim (.Values.vapid.privateKey | default "") }}
{{- $vapidPublicKey := trim (.Values.vapid.publicKey | default "") }}
{{- $vapidSubject := trim (.Values.vapid.subject | default "") }}
{{- if and (not $vapidPrivateKey) (not $vapidExistingSecret) }}
{{- fail "vapid.enabled is true, so vapid.existingSecret (recommended) or vapid.privateKey is required for VAPID_PRIVATE_KEY." }}
{{- end }}
{{- if and (not $vapidPublicKey) (not $vapidExistingSecret) }}
{{- fail "vapid.enabled is true, so vapid.publicKey or vapid.existingSecret is required for VAPID_PUBLIC_KEY." }}
{{- end }}
{{- if and (not $vapidSubject) (not $vapidExistingSecret) }}
{{- fail "vapid.enabled is true, so vapid.subject or vapid.existingSecret is required for VAPID_SUBJECT." }}
{{- end }}
{{- if and $vapidSubject (not (or (hasPrefix "mailto:" $vapidSubject) (hasPrefix "https://" $vapidSubject))) }}
{{- fail "vapid.subject must start with mailto: or https:// (RFC 8292)." }}
{{- end }}
{{- end }}
{{- $emailPublicUrl := include "budget-app.emailPublicUrl" . }}
{{- if .Values.email.enabled }}
{{- $emailProvider := trim (.Values.email.provider | default "resend") }}
{{- if ne $emailProvider "resend" }}
{{- fail (printf "email.provider=%q is unsupported; supported providers: resend" $emailProvider) }}
{{- end }}
{{- if not (trim (.Values.email.fromAddress | default "")) }}
{{- fail "email.fromAddress is required when email.enabled is true." }}
{{- end }}
{{- if and (not (trim (.Values.email.existingSecret | default ""))) (not (trim (.Values.email.apiKey | default ""))) }}
{{- fail "email.existingSecret (recommended) or email.apiKey is required for RESEND_API_KEY when email.enabled is true." }}
{{- end }}
{{- if not $emailPublicUrl }}
{{- fail "email.publicUrl (or ingress.hosts[0].host) is required when email.enabled is true." }}
{{- end }}
{{- end }}
{{- if .Values.oidc.provisioning.enabled }}
{{- $idpProvider := trim (.Values.oidc.provisioning.provider | default "authentik") }}
{{- if ne $idpProvider "authentik" }}
{{- fail (printf "oidc.provisioning.provider=%q is unsupported; supported providers: authentik" $idpProvider) }}
{{- end }}
{{- $idpBaseUrl := trim (.Values.oidc.provisioning.baseUrl | default "") }}
{{- if not (or (hasPrefix "https://" $idpBaseUrl) (hasPrefix "http://" $idpBaseUrl)) }}
{{- fail "oidc.provisioning.baseUrl must start with https:// or http:// when oidc.provisioning.enabled is true." }}
{{- end }}
{{- if and (not (trim (.Values.oidc.provisioning.existingSecret | default ""))) (not (trim (.Values.oidc.provisioning.apiToken | default ""))) }}
{{- fail "oidc.provisioning.existingSecret (recommended) or oidc.provisioning.apiToken is required for AUTHENTIK_API_TOKEN when oidc.provisioning.enabled is true." }}
{{- end }}
{{- end }}
  OIDC_ISSUER_URL: {{ .Values.oidc.issuerUrl | quote }}
  OIDC_AUTHORITY: {{ .Values.oidc.authority | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  # Audience ("aud") verification. Disable only to work around an identity provider
  # that issues this client a token with a different audience.
  OIDC_ENFORCE_AUDIENCE: {{ .Values.oidc.enforceAudience | quote }}
  PLATFORM_ADMIN_GROUP: {{ trim (.Values.oidc.adminGroup | default "budget-admins") | quote }}
  {{- if .Values.oidc.adminEmails }}
  PLATFORM_ADMIN_EMAILS: {{ join "," .Values.oidc.adminEmails | quote }}
  {{- end }}
  # Comma-separated browser origins permitted for cross-site API calls. Derived from
  # the ingress hosts unless backend.corsAllowedOrigins sets it explicitly.
  CORS_ALLOWED_ORIGINS: {{ include "budget-app.corsAllowedOrigins" . | quote }}
  # Demo SimpleFIN bridge addressing. The bridge is served by the API process; when the
  # sync worker is its own Deployment it reaches the bridge over this Service rather than
  # loopback, which is what lets demo bank sync survive backend scaling.
  MOCK_SIMPLEFIN_LISTEN_ADDR: {{ include "budget-app.bridgeListenAddr" . | quote }}
  MOCK_SIMPLEFIN_BASE_URL: {{ include "budget-app.bridgeBaseUrl" . | quote }}
  # Temporal orchestration. Bank sync workflows and their recurring schedules run here;
  # TEMPORAL_NAMESPACE is registered by the API at boot when it does not exist yet.
  TEMPORAL_ADDRESS: {{ .Values.temporal.address | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  TEMPORAL_RETENTION: {{ .Values.temporal.retention | quote }}
  API_BASE_URL: {{ .Values.frontend.apiBaseUrl | quote }}
  PORT: {{ .Values.backend.port | quote }}
  DB_MAX_CONNS: {{ .Values.backend.dbMaxConns | quote }}
  {{- if .Values.vapid.enabled }}
  {{- if trim (.Values.vapid.publicKey | default "") }}
  VAPID_PUBLIC_KEY: {{ trim .Values.vapid.publicKey | quote }}
  {{- end }}
  {{- if trim (.Values.vapid.subject | default "") }}
  VAPID_SUBJECT: {{ trim .Values.vapid.subject | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.email.enabled }}
  EMAIL_PROVIDER: {{ trim (.Values.email.provider | default "resend") | quote }}
  EMAIL_FROM_ADDRESS: {{ trim .Values.email.fromAddress | quote }}
  APP_PUBLIC_URL: {{ $emailPublicUrl | quote }}
  {{- else if $emailPublicUrl }}
  APP_PUBLIC_URL: {{ $emailPublicUrl | quote }}
  {{- end }}
  {{- if .Values.oidc.provisioning.enabled }}
  IDP_PROVISIONING_PROVIDER: {{ trim (.Values.oidc.provisioning.provider | default "authentik") | quote }}
  AUTHENTIK_BASE_URL: {{ trim .Values.oidc.provisioning.baseUrl | trimSuffix "/" | quote }}
  {{- end }}
