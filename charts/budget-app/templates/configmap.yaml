apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "budget-app.fullname" . }}-config
  labels:
    {{- include "budget-app.labels" . | nindent 4 }}
data:
  OIDC_ISSUER_URL: {{ .Values.oidc.issuerUrl | quote }}
  OIDC_AUTHORITY: {{ .Values.oidc.authority | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  API_BASE_URL: {{ .Values.frontend.apiBaseUrl | quote }}
  PORT: {{ .Values.backend.port | quote }}
  DB_MAX_CONNS: {{ .Values.backend.dbMaxConns | quote }}
