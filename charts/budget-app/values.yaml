backend:
  replicaCount: 1
  image:
    repository: ghcr.io/ckchessmaster/budget-backend
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  dbMaxConns: 25
  runMigrations: true
  # Browser origins allowed to call the API cross-site. Empty derives the list from
  # the ingress hosts below. The frontend proxies /api same-origin, so this is only
  # needed when the API is served from a different origin than the app.
  corsAllowedOrigins: []
  # The built-in demo SimpleFIN bridge binds loopback by default (127.0.0.1:8090) so
  # no other pod can reach it. Set these only if the Temporal sync worker runs in a
  # separate pod: bind a routable address and point the worker's base URL at it.
  mockSimplefinListenAddr: ""
  mockSimplefinBaseUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/ckchessmaster/budget-frontend
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  apiBaseUrl: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

oidc:
  issuerUrl: "https://auth.example.com/application/o/budget-app/"
  authority: "https://auth.example.com/application/o/budget-app/"
  clientId: "budget-app-client"
  # Require the token's aud claim to contain clientId. Set to false only as an
  # emergency escape hatch; signature, issuer and expiry are always verified.
  enforceAudience: true

database:
  # Name of an existing Secret containing DATABASE_URL (recommended)
  existingSecret: "budget-backend-secrets"
  secretKey: "DATABASE_URL"
  # Or leave existingSecret empty and pass --set database.url=... at install time
  url: ""

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: budget.example.com
  tls: []
